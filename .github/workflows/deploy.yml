name: Deploy

on:
  push:
    tags:
      - "public-v*"
      - "admin-v*"

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/security.yml

  build-admin:
    needs: validate
    if: startsWith(github.ref_name, 'admin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          load: true
          pull: true
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.NEXT_PUBLIC_BETTER_AUTH_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/admin:latest

      - name: Check runtime and scan final image
        run: bash scripts/verify-production-image.sh "${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.ref_name }}"

      - name: Publish verified image
        run: |
          docker push "${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.ref_name }}"
          docker push "${{ env.REGISTRY }}/${{ github.repository }}/admin:latest"


  build-public:
    needs: validate
    if: startsWith(github.ref_name, 'public-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify public image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/public/Dockerfile
          push: false
          load: true
          pull: true
          build-args: |
            NEXT_PUBLIC_ADMIN_URL=${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}
            POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/public:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/public:latest

      - name: Check runtime and scan final image
        run: bash scripts/verify-production-image.sh "${{ env.REGISTRY }}/${{ github.repository }}/public:${{ github.ref_name }}"

      - name: Publish verified image
        run: |
          docker push "${{ env.REGISTRY }}/${{ github.repository }}/public:${{ github.ref_name }}"
          docker push "${{ env.REGISTRY }}/${{ github.repository }}/public:latest"


  deploy-public:
    needs: build-public
    if: startsWith(github.ref_name, 'public-v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to CapRover (public)
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.CAPROVER_APP_PUBLIC }}
          token: ${{ secrets.CAPROVER_TOKEN_PUBLIC }}
          image: ${{ env.REGISTRY }}/${{ github.repository }}/public:${{ github.ref_name }}

  deploy-admin:
    needs: build-admin
    if: startsWith(github.ref_name, 'admin-v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to CapRover (admin)
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.CAPROVER_APP_ADMIN }}
          token: ${{ secrets.CAPROVER_TOKEN_ADMIN }}
          image: ${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.ref_name }}
